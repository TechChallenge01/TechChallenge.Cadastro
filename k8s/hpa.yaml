apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cadastro-service-hpa
  namespace: techchallenge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cadastro-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
